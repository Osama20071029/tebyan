<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تبيان</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap');
:root{--w:#fff;--b:#0a0a0a;--g50:#fafafa;--g100:#f4f4f5;--g200:#e4e4e7;--g400:#a1a1aa;--g500:#71717a;--g700:#3f3f46;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--g50);min-height:100vh;color:var(--b);}

.wrap{max-width:680px;margin:0 auto;padding:32px 20px 60px;}

/* هيدر */
.head{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
.logo{width:44px;height:66px;flex-shrink:0;color:var(--b);}
.head h1{font-size:26px;font-weight:900;letter-spacing:2px;}
.head p{font-size:13px;color:var(--g400);margin-top:2px;}

/* بطاقة */
.card{background:var(--w);border:1.5px solid var(--g200);border-radius:18px;padding:22px;margin-bottom:18px;}
.card-title{font-size:14px;font-weight:700;color:var(--g700);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--b);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* حقل API */
.api-row{position:relative;}
.inp{width:100%;height:50px;border:1.5px solid var(--g200);border-radius:13px;padding:0 46px 0 16px;font-size:14px;font-family:'Tajawal',sans-serif;background:var(--g50);outline:none;direction:ltr;text-align:left;}
.inp:focus{border-color:#888;background:var(--w);}
.eye{position:absolute;left:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--g400);background:none;border:none;}

/* منطقة رفع */
.drop{border:2px dashed var(--g200);border-radius:16px;padding:36px 20px;text-align:center;cursor:pointer;transition:.2s;}
.drop:hover{border-color:#888;background:var(--g50);}
.drop svg{margin-bottom:10px;color:var(--g400);}
.drop-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.drop-sub{font-size:12px;color:var(--g400);}

/* قائمة الملفات */
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.file-item{display:flex;align-items:center;gap:10px;background:var(--g50);border:1.5px solid var(--g200);border-radius:12px;padding:10px 12px;}
.file-item span.ic{font-size:18px;}
.file-item .name{flex:1;font-size:13px;font-weight:600;}
.file-item .size{font-size:11px;color:var(--g400);}
.file-item .rm{cursor:pointer;color:var(--g400);}

/* زر رئيسي */
.btn{width:100%;height:52px;background:var(--b);color:white;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:disabled{background:var(--g200);color:var(--g400);cursor:not-allowed;}
.btn:not(:disabled):hover{background:#222;}

/* حالة المعالجة */
.status{display:none;align-items:center;gap:10px;padding:14px;background:var(--g50);border-radius:12px;font-size:13px;color:var(--g500);margin-top:14px;}
.status.show{display:flex;}
.spin{animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* صندوق النص */
.textbox{width:100%;min-height:320px;border:1.5px solid var(--g200);border-radius:14px;padding:16px;font-size:14px;font-family:'Tajawal',sans-serif;line-height:2;resize:vertical;outline:none;background:var(--g50);}
.textbox:focus{border-color:#888;background:var(--w);}

/* نتائج */
.result-row{display:flex;align-items:center;gap:12px;background:var(--g50);border:1.5px solid var(--g200);border-radius:14px;padding:14px;margin-top:10px;}
.result-row .ic{font-size:24px;flex-shrink:0;}
.result-row .info{flex:1;}
.result-row .info .n{font-size:14px;font-weight:700;}
.result-row .info .s{font-size:12px;color:var(--g400);margin-top:2px;}
.dl{width:38px;height:38px;border-radius:10px;background:var(--b);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.dl:disabled{background:var(--g200);cursor:not-allowed;}

.hidden{display:none !important;}
</style>
</head>
<body>

<div class="wrap">

  <div class="head">
    <svg class="logo" viewBox="0 0 80 120">
      <path d="M65,8 C72,14 76,24 74,36 C72,50 60,62 48,72 C38,80 28,86 20,96 C16,101 14,107 15,112 C10,108 8,102 10,96 C14,84 26,76 36,68 C48,58 60,46 64,32 C66,24 64,14 58,10 Z" fill="currentColor"/>
      <path d="M58,10 C50,18 44,28 40,40" stroke="white" stroke-width="1.2" fill="none"/>
      <path d="M40,40 C36,54 26,70 15,112" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
    </svg>
    <div>
      <h1>تبيان</h1>
      <p>تحويل صفحات الكتب إلى نص وصوت</p>
    </div>
  </div>

  <!-- 1. مفتاح API -->
  <div class="card">
    <div class="card-title"><span class="step-num">١</span> مفتاح Gemini API</div>
    <div class="api-row">
      <input class="inp" id="apiKey" type="password" placeholder="AIza...">
      <button class="eye" onclick="toggleKey()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <!-- 2. رفع الملف -->
  <div class="card">
    <div class="card-title"><span class="step-num">٢</span> رفع الصفحات</div>
    <input type="file" id="filePicker" accept="application/pdf,image/jpeg,image/png,image/webp" multiple style="display:none">
    <div class="drop" id="dropZone">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div class="drop-title">اضغط لرفع ملف PDF أو صور</div>
      <div class="drop-sub">يمكن رفع عدة صور بترتيبها، أو ملف PDF واحد</div>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <!-- زر المعالجة -->
  <button class="btn" id="processBtn" onclick="startProcessing()" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    استخراج النص
  </button>
  <div class="status" id="status">
    <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
    <span id="statusText">جاري الاستخراج...</span>
  </div>

  <!-- 3. مراجعة النص -->
  <div class="card hidden" id="reviewCard">
    <div class="card-title"><span class="step-num">٣</span> مراجعة النص وتعديله</div>
    <textarea class="textbox" id="textBox" placeholder="سيظهر النص هنا..."></textarea>
    <button class="btn" style="margin-top:14px;" onclick="generateOutputs()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      تحويل إلى Word وصوت
    </button>
  </div>

  <!-- 4. النتائج -->
  <div class="card hidden" id="resultsCard">
    <div class="card-title"><span class="step-num">٤</span> النتائج</div>
    <div class="result-row">
      <span class="ic">📝</span>
      <div class="info"><div class="n">ملف Word</div><div class="s" id="wordStatus">جاري التحضير...</div></div>
      <button class="dl" id="wordDl" disabled onclick="downloadWord()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
    <div class="result-row">
      <span class="ic">🔊</span>
      <div class="info"><div class="n">ملف صوتي</div><div class="s" id="audioStatus">جاري التحضير...</div></div>
      <button class="dl" id="audioDl" disabled onclick="downloadAudio()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
let files = [];
let wordBlob = null, audioBlob = null;

document.getElementById('dropZone').addEventListener('click', function(){
  document.getElementById('filePicker').click();
});

document.getElementById('filePicker').addEventListener('change', function(e){
  const newFiles = Array.from(e.target.files);
  newFiles.forEach(f => files.push(f));
  renderFiles();
  e.target.value = '';
});

function toggleKey(){
  const i = document.getElementById('apiKey');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function renderFiles(){
  const list = document.getElementById('fileList');
  const btn = document.getElementById('processBtn');
  list.innerHTML = files.map((f,i) => `
    <div class="file-item">
      <span class="ic">${f.type.includes('pdf')?'📄':'🖼️'}</span>
      <div class="name">${f.name}</div>
      <div class="size">${(f.size/1024).toFixed(0)} KB</div>
      <span class="rm" onclick="removeFile(${i})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </div>`).join('');
  btn.disabled = files.length === 0;
}

function removeFile(i){
  files.splice(i,1);
  renderFiles();
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function callGemini(key, parts){
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts}]})
  });
  const d = await r.json();
  if(!d.candidates) throw new Error(d.error?.message || 'خطأ في الاتصال');
  return d.candidates[0].content.parts[0].text;
}

function setStatus(show, text){
  const s = document.getElementById('status');
  s.classList.toggle('show', show);
  if(text) document.getElementById('statusText').textContent = text;
}

async function startProcessing(){
  const key = document.getElementById('apiKey').value.trim();
  if(!key){ alert('أدخل مفتاح API أولاً'); return; }
  if(!files.length) return;

  document.getElementById('processBtn').disabled = true;
  setStatus(true, 'جاري استخراج النص...');

  try{
    const parts = [];
    for(const f of files){
      const b64 = await fileToBase64(f);
      parts.push({inline_data:{mime_type:f.type||'application/pdf', data:b64}});
    }
    parts.push({text:'استخرج النص من هذه الصفحة/الصفحات كاملاً كما هو حرفياً بدون أي تعديل. انسخ كل حرف ورمز وعلامة ترقيم وأقواس وأرقام صفحات. حافظ على ترتيب الصفحات. لا تضف أي تعليق أو مقدمة.'});

    const rawText = await callGemini(key, parts);

    setStatus(true, 'جاري تطبيق التنسيق...');
    const editedText = await callGemini(key, [{text:
      `طبّق على هذا النص قواعد التنسيق التالية فقط:
١. انقل رقم كل صفحة لأعلى نصها مع سطر فارغ قبله وبعده
٢. الهوامش (مثل (١) وما يقابلها) انقلها لسطر مستقل بعد نهاية الفقرة المشيرة إليها
٣. الفقرات العادية: ادمج أسطرها في فقرة واحدة متصلة
٤. العناوين والعناصر المرقمة: كل عنصر في سطر مستقل
٥. النص مطابق تماماً بدون زيادة أو نقصان أو تشكيل
٦. حافظ على علامات الترقيم كما هي
٧. لا تضف أي تعليق، أعد النص فقط

النص:
${rawText}`
    }]);

    document.getElementById('textBox').value = editedText;
    document.getElementById('reviewCard').classList.remove('hidden');
    setStatus(false);
  }catch(e){
    setStatus(false);
    alert('حدث خطأ: ' + e.message);
  }finally{
    document.getElementById('processBtn').disabled = false;
  }
}

async function generateOutputs(){
  const key = document.getElementById('apiKey').value.trim();
  const text = document.getElementById('textBox').value;
  if(!text.trim()) return;

  document.getElementById('resultsCard').classList.remove('hidden');
  document.getElementById('wordStatus').textContent = 'جاري الإنشاء...';
  document.getElementById('audioStatus').textContent = 'جاري التشكيل والتوليد...';

  // Word
  try{
    await buildWord(text);
    document.getElementById('wordStatus').textContent = 'جاهز للتحميل';
    document.getElementById('wordDl').disabled = false;
  }catch(e){
    document.getElementById('wordStatus').textContent = 'فشل: ' + e.message;
  }

  // صوت: تشكيل ثم TTS مقسّماً لمقاطع لضمان ثبات الجودة
  try{
    const vocalText = await callGemini(key, [{text:
      `شكّل هذا النص العربي كاملاً بالحركات الكاملة (فتحة، ضمة، كسرة، شدة، تنوين) للقراءة الصوتية. لا تضع حركة على آخر كلمة في موضع الوقف الطبيعي (نهاية الجملة). حافظ على علامات الترقيم. أعد النص المشكّل فقط بدون أي تعليق.\n\n${text}`
    }]);

    const chunks = splitIntoChunks(vocalText, 450);
    const audioBlobs = [];
    for(let i=0;i<chunks.length;i++){
      document.getElementById('audioStatus').textContent = `جاري توليد المقطع ${i+1} من ${chunks.length}...`;
      const audioRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${key}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          contents:[{parts:[{text:`اقرأ هذا النص بصوت واضح وسرعة ثابتة ومتوسطة:\n\n${chunks[i]}`}]}],
          generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Charon'}}}}
        })
      });
      const audioData = await audioRes.json();
      if(!audioData.candidates) throw new Error('فشل توليد مقطع ' + (i+1));
      const pcmB64 = audioData.candidates[0].content.parts[0].inlineData.data;
      audioBlobs.push(pcmToWavBlob(pcmB64));
    }

    document.getElementById('audioStatus').textContent = 'جاري دمج المقاطع...';
    audioBlob = await concatWavBlobs(audioBlobs);
    document.getElementById('audioStatus').textContent = 'جاهز للتحميل';
    document.getElementById('audioDl').disabled = false;
  }catch(e){
    document.getElementById('audioStatus').textContent = 'فشل: ' + e.message;
  }
}

// تقسيم النص لمقاطع عند نهايات الجمل
function splitIntoChunks(text, maxLen=450){
  const sentences = text.split(/(?<=[.؟!؛])\s+/);
  const chunks = [];
  let cur = '';
  for(const s of sentences){
    if((cur+s).length > maxLen && cur){
      chunks.push(cur.trim());
      cur = s;
    } else {
      cur += (cur?' ':'') + s;
    }
  }
  if(cur.trim()) chunks.push(cur.trim());
  return chunks;
}

// دمج عدة WAV blobs بنفس sample rate
async function concatWavBlobs(blobs){
  const buffers = await Promise.all(blobs.map(b => b.arrayBuffer()));
  const pcmParts = buffers.map(buf => new Uint8Array(buf, 44)); // تخطي الهيدر 44 بايت
  const totalLen = pcmParts.reduce((s,p)=>s+p.length,0);
  const merged = new Uint8Array(totalLen);
  let offset = 0;
  for(const p of pcmParts){ merged.set(p, offset); offset += p.length; }
  return wavFromPcmBytes(merged, 24000);
}

function wavFromPcmBytes(pcmBytes, sampleRate){
  const dataSize = pcmBytes.length;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  function writeStr(o,s){for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i));}
  writeStr(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,1,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40,dataSize,true);
  new Uint8Array(buffer,44).set(pcmBytes);
  return new Blob([buffer], {type:'audio/wav'});
}

function pcmToWavBlob(base64pcm, sampleRate=24000){
  const pcmBytes = Uint8Array.from(atob(base64pcm), c => c.charCodeAt(0));
  return wavFromPcmBytes(pcmBytes, sampleRate);
}

async function buildWord(text){
  const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
  const lines = text.split('\n');
  const children = lines.map(line => {
    const trimmed = line.trim();
    const isPageNum = /^[\u0660-\u0669٠-٩\d]+$/.test(trimmed);
    return new Paragraph({
      alignment: isPageNum ? AlignmentType.CENTER : AlignmentType.RIGHT,
      bidirectional: true,
      children: [new TextRun({
        text: trimmed,
        font: 'Times New Roman',
        size: isPageNum ? 32 : 28,
        bold: isPageNum
      })]
    });
  });
  const doc = new Document({sections:[{children}]});
  wordBlob = await Packer.toBlob(doc);
}

function downloadWord(){
  if(!wordBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(wordBlob);
  a.download = 'tabyan_output.docx';
  a.click();
}

function downloadAudio(){
  if(!audioBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(audioBlob);
  a.download = 'tabyan_output.wav';
  a.click();
}
</script>
</body>
</html>
