<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="UTF-8"></head>
<body>
<button id="btn" style="width:300px;height:80px;font-size:20px;">اضغط للرفع</button>
<input type="file" id="picker" accept="image/*" style="display:none">
<div id="result" style="margin-top:20px;font-size:18px;"></div>

<script>
document.getElementById('btn').addEventListener('click', function(){
  document.getElementById('picker').click();
});
document.getElementById('picker').addEventListener('change', function(e){
  document.getElementById('result').textContent = 'تم اختيار: ' + e.target.files.length + ' ملف';
});
</script>
</body>
</html>
